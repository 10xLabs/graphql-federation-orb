description: >
  Publish a subgraph schema to a federated supergraph and upload the composed
  supergraph to S3. Nothing is republished when the schema has not changed.

usage:
  version: 2.1
  orbs:
    graphql-federation: nexbus/graphql-federation@1.2.3
  workflows:
    publish:
      jobs:
        - graphql-federation/publish:
            supergraph: my-supergraph
            directory: graphql/schema
