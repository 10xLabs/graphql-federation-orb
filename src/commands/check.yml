description: >
  Check schema changes to a subgraph against one of your federated supergraphs.
  Skips the check when the supergraph already serves this schema, or when the PR
  does not target base_branch. Skipping is scoped to this command: it never halts
  the job, so your own steps around it still run.
parameters:
  base_branch:
    type: string
    description: "The name of the base branch to run the check"
    default: ""
  supergraph:
    type: string
    description: "The name of the supergraph to check against"
  subgraph:
    type: string
    default: ""
    description: "The name of the subgraph (defaults to $CIRCLE_PROJECT_REPONAME)"
  directory:
    type: string
    default: "graphql/schema"
    description: "Directory containing graphql schema files"
steps:
  - run:
      environment:
        BASE_BRANCH: <<parameters.base_branch>>
      name: Check the base branch
      command: <<include(scripts/check_base_branch.sh)>>
  - run:
      name: Install Rover CLI
      command: <<include(scripts/install_rover_cli.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
      name: Set Apollo API key
      command: <<include(scripts/set_apollo_key.sh)>>
  - run:
      environment:
        DIRECTORY: <<parameters.directory>>
      name: Build subgraph schema
      command: <<include(scripts/build_schema.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
        SUBGRAPH: <<parameters.subgraph>>
      name: Compare published subgraph
      command: <<include(scripts/compare_published_schema.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
        SUBGRAPH: <<parameters.subgraph>>
      name: Check subgraph
      command: <<include(scripts/check_subgraph.sh)>>
