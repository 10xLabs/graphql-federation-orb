description: >
  Publish schema changes to a subgraph of one of your federated supergraphs, then
  upload the composed supergraph to S3. Skips the check and publish steps when the
  supergraph already serves this schema; the upload still runs, so a re-run heals a
  gateway left stale by an earlier failure. Skipping is scoped to this command: it
  never halts the job, so your own steps around it still run.
parameters:
  supergraph:
    type: string
    description: "The name of the supergraph to publish to"
  subgraph:
    type: string
    default: ""
    description: "The name of the subgraph (defaults to $CIRCLE_PROJECT_REPONAME)"
  directory:
    type: string
    default: "graphql/schema"
    description: "Directory containing graphql schema files"
steps:
  - run:
      name: Reset federation state
      command: <<include(scripts/reset_state.sh)>>
  - run:
      name: Install Rover CLI
      command: <<include(scripts/install_rover_cli.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
      name: Set Apollo API key
      command: <<include(scripts/set_apollo_key.sh)>>
  - run:
      environment:
        DIRECTORY: <<parameters.directory>>
      name: Build subgraph schema
      command: <<include(scripts/build_schema.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
        SUBGRAPH: <<parameters.subgraph>>
      name: Compare published subgraph
      command: <<include(scripts/compare_published_schema.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
        SUBGRAPH: <<parameters.subgraph>>
      name: Check subgraph
      command: <<include(scripts/check_subgraph.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
        SUBGRAPH: <<parameters.subgraph>>
      name: Publish subgraph
      command: <<include(scripts/publish_subgraph.sh)>>
  - run:
      name: Install AWS CLI
      command: <<include(scripts/install_aws_cli.sh)>>
  - run:
      environment:
        SUPERGRAPH: <<parameters.supergraph>>
      name: Fetch supergraph
      command: <<include(scripts/fetch_supergraph.sh)>>
