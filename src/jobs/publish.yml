description: >
  Publish schema changes to a subgraph of one of your federated supergraphs,
  then upload the composed supergraph to S3 for the gateway to consume.
  Skips the publish when the supergraph already serves this schema; the upload
  still runs, so a re-run heals a gateway left stale by an earlier failure.

executor: default

parameters:
  supergraph:
    type: string
    description: "The name of the supergraph to publish to"
  subgraph:
    type: string
    default: ""
    description: "The name of the subgraph (defaults to $CIRCLE_PROJECT_REPONAME)"
  directory:
    type: string
    default: "graphql/schema"
    description: "Directory containing graphql schema files"
steps:
  - checkout
  - publish:
      directory: << parameters.directory >>
      supergraph: << parameters.supergraph >>
      subgraph: << parameters.subgraph >>
