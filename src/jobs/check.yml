description: >
  Check schema changes to a subgraph against one of your federated supergraphs.
  Skips the check when the PR does not target base_branch, or when the supergraph
  already serves this schema.

executor: default

parameters:
  base_branch:
    type: string
    description: "The name of the base branch to run the check"
    default: ""
  supergraph:
    type: string
    description: "The name of the supergraph to check against"
  subgraph:
    type: string
    default: ""
    description: "The name of the subgraph (defaults to $CIRCLE_PROJECT_REPONAME)"
  directory:
    type: string
    default: "graphql/schema"
    description: "Directory containing graphql schema files"
steps:
  - checkout
  - check:
      base_branch: <<parameters.base_branch>>
      directory: <<parameters.directory>>
      supergraph: <<parameters.supergraph>>
      subgraph: <<parameters.subgraph>>
