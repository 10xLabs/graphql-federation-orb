version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.3.1
  shellcheck: circleci/shellcheck@3.4.0

filters: &filters
  tags:
    only: /.*/

jobs:
  # Exercises src/scripts/*.sh directly — these are the files inlined into the
  # orb at pack time, so a green run here is a statement about shipped code.
  script-tests:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install jq
          command: |
            command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - run:
          name: Run script test suite
          command: bash tests/run.sh

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - shellcheck/check:
          filters: *filters
      - script-tests:
          filters: *filters
      - orb-tools/publish:
          orb_name: nexbus/graphql-federation
          vcs_type: << pipeline.project.type >>
          requires:
            [
              orb-tools/lint,
              orb-tools/review,
              orb-tools/pack,
              shellcheck/check,
              script-tests,
            ]
          # Use a context to hold your publishing token.
          context: orb-publishing
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          orb_name: nexbus/graphql-federation
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires: [orb-tools/publish]
          filters: *filters
